<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <title>tv_screen</title>
    <style>
        html, body { margin: 0; width: 100%; height: 100%; background: #000; overflow: hidden;
            font-family: 'Segoe UI', Arial, sans-serif; color: #fff; }
        #stage { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #000; }
        #stage iframe, #stage #yt { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0; }
        #overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex;
            align-items: center; justify-content: center; text-align: center; padding: 60px;
            font-size: 46px; line-height: 1.3; background: rgba(0, 0, 0, .78); z-index: 5; }
        #overlay.hidden { display: none; }
    </style>
</head>
<body>
    <div id="stage"></div>
    <div id="overlay" class="hidden"></div>
    <script src="screen.js"></script>
</body>
</html>
